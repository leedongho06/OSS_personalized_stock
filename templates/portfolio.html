<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 포트폴리오</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💼 내 포트폴리오</h1>
            <p>관심 기업을 입력하고 나만의 투자 성향을 파악하세요</p>
        </header>

        <!-- 관심 기업 입력 -->
        <div class="card">
            <h2>🏢 관심 기업 입력</h2>
            <p>평소 관심 있던 기업을 최대 3개 입력해주세요</p>
            <form action="/recommend" method="POST">
                <input type="text" name="companies"
                       placeholder="예: 삼성전자" class="input-field">
                <input type="text" name="companies"
                       placeholder="예: 카카오" class="input-field">
                <input type="text" name="companies"
                       placeholder="예: 현대차" class="input-field">
                <button type="submit" class="btn btn-primary">
                    종목 추천받기
                </button>
            </form>
        </div>

        <!-- 투자 성향 -->
        {% if style %}
        <div class="card">
            <h2>📊 내 투자 성향</h2>
            <div class="style-badge">{{ style }}</div>
        </div>
        {% endif %}

        <!-- 피드백 이력 -->
        {% if history %}
        <div class="card">
            <h2>📋 추천 이력</h2>
            <table class="stock-table">
                <thead>
                    <tr>
                        <th>추천 종목</th>
                        <th>섹터</th>
                        <th>평가</th>
                    </tr>
                </thead>
                <tbody>
                    {% for h in history %}
                    <tr>
                        <td><strong>{{ h.name }}</strong></td>
                        <td><span class="sector-badge">{{ h.sector }}</span></td>
                        <td>{{ '⭐' * h.score }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% endif %}

        <a href="/" class="btn btn-secondary">메인으로</a>
    </div>
</body>
</html>
