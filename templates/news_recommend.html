<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>투자 성향 맞춤 뉴스 추천</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 40px; background-color: #f8f9fa; }
        .container { background-color: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #1e293b; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 1.1em; }
        
        /* 3가지 성향 버튼 디자인 */
        .btn-group { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .style-btn { padding: 15px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-safe { background-color: #10b981; } /* 안정형: 초록 */
        .btn-neutral { background-color: #64748b; } /* 중립형: 회색 */
        .btn-aggro { background-color: #ef4444; } /* 공격형: 빨강 */
        .style-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); opacity: 0.9; }

        /* 뉴스 출력 리스트 디자인 */
        .news-item { padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 15px; transition: 0.2s; }
        .news-item:hover { background-color: #f1f5f9; }
        .news-title { font-size: 1.25em; font-weight: bold; color: #0f172a; margin-bottom: 10px; }
        .news-desc { color: #475569; line-height: 1.6; }
        .sector-badge { display: inline-block; padding: 4px 10px; background-color: #3b82f6; color: white; border-radius: 20px; font-size: 0.85em; margin-right: 8px; font-weight: bold; }
        
        .home-btn { display: block; width: 220px; margin: 40px auto 0; padding: 12px; text-align: center; background-color: #3b82f6; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 내 성향에 맞는 뉴스 골라보기</h1>
        <p class="subtitle">관심 있는 투자 성향 버튼을 클릭하면, AI가 맞춤 뉴스를 추천해 드립니다.</p>
 <!-- 💡 새로 추가된 AI 맞춤 뉴스 추천 이동 버튼 -->
        <div style="text-align: center; margin: 20px 0 40px 0;">
            <a href="/news/recommend" style="display: inline-block; padding: 15px 30px; background-color: #ef4444; color: white; font-size: 1.2em; font-weight: bold; text-decoration: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;">
                🧠 AI 투자 성향 맞춤 뉴스 추천 모드 켜기 (Click!)
            </a>
        </div>
        
        <form method="POST" action="/news/recommend" class="btn-group">
            <button type="submit" name="style" value="안정형" class="style-btn btn-safe">🛡️ 안정형 추천</button>
            <button type="submit" name="style" value="중립형" class="style-btn btn-neutral">⚖️ 중립형 추천</button>
            <button type="submit" name="style" value="공격형" class="style-btn btn-aggro">⚔️ 공격형 추천</button>
        </form>

        {% if selected_style %}
        <div style="border-top: 2px solid #e2e8f0; padding-top: 30px;">
            <h2 style="color: #1e293b; margin-bottom: 20px;">✨ <span style="color: #3b82f6;">{{ selected_style }}</span> 맞춤 뉴스 결과</h2>
            {% for n in news %}
            <div class="news-item">
                <div class="news-title">
                    <span class="sector-badge">{{ n.sector }}</span>{{ n.title | safe }}
                </div>
                <div class="news-desc">{{ n.description | safe }}</div>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        
        <a href="/" class="home-btn">메인 화면으로 돌아가기</a>
    </div>
</body>
</html>
