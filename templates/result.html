<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추천 결과</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 추천 결과</h1>
            <div class="style-badge">{{ style }}</div>
        </header>

        <div class="card">
            <h2>🏆 최종 추천 종목</h2>
            <div class="final-stock">{{ final }}</div>
        </div>

        <div class="card">
            <h2>📈 Top 5 추천 종목</h2>
            <table class="stock-table">
                <thead>
                    <tr>
                        <th>종목명</th>
                        <th>섹터</th>
                        <th>PER</th>
                        <th>PBR</th>
                        <th>유사도</th>
                    </tr>
                </thead>
                <tbody>
                    {% for s in result %}
                    <tr>
                        <td><strong>{{ s.name }}</strong></td>
                        <td><span class="sector-badge">{{ s.sector }}</span></td>
                        <td>{{ s.per }}</td>
                        <td>{{ s.pbr }}</td>
                        <td>{{ s.score }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>💬 추천 결과 평가</h2>
            <p>추천 결과가 만족스러우셨나요?</p>
            <form action="/feedback" method="POST">
                <div class="star-rating">
                    {% for star in [5,4,3,2,1] %}
                    <input type="radio" name="score"
                           id="score_{{ star }}"
                           value="{{ star }}" required>
                    <label for="score_{{ star }}">★</label>
                    {% endfor %}
                </div>
                <button type="submit" class="btn btn-primary">
                    피드백 제출 후 포트폴리오 보기
                </button>
            </form>
        </div>

        <a href="/" class="btn btn-secondary">처음으로 돌아가기</a>
    </div>
</body>
</html>
