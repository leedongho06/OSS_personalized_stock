<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맞춤형 주식 추천 시스템</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>맞춤형 주식 추천 시스템</h1>
            <p>당신의 투자 성향에 딱 맞는 종목을 찾아드립니다.</p>
        </header>

        <div class="card-grid">
            <div class="card">
                <h2>🏢 관심 기업 입력</h2>
                <p>관심 있는 기업을 입력하면<br>투자 성향을 분석해드립니다</p>

                <form id="rec-form" action="/recommend" method="POST">
                    <div class="ac-wrap">
                        <div id="tag-field" class="tag-field" onclick="handleFieldClick(event)">
                            <input
                                id="tag-text"
                                class="tag-text"
                                type="text"
                                placeholder="예: 삼성전자, 카카오, 현대차…"
                                maxlength="30"
                                autocomplete="off"
                                spellcheck="false"
                            >
                        </div>
                    </div>

                    <div class="tag-meta">
                        <kbd>Enter</kbd> 또는 <kbd>,</kbd> 로 추가 · <kbd>←</kbd> 로 삭제
                        <span class="spacer"></span>
                        <button type="button" id="reset-btn" class="tag-reset" style="display:none" onclick="clearTagsAll()">
                            전체 삭제
                        </button>
                        <span id="tag-count" class="tag-count" style="display:none"></span>
                    </div>

                    <button type="submit" id="submit-btn" class="btn btn-primary" disabled>
                        종목 추천받기
                    </button>
                </form>
            </div>

            <div class="card">
                <h2>📰 뉴스 관심도 평가</h2>
                <p>최신 뉴스에 별점을 매겨<br>투자 성향을 파악합니다</p>
                <a href="/news" class="btn btn-secondary">
                    뉴스 평가 시작하기
                </a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/autocomplete.js') }}" defer></script>
</body>
</html>
