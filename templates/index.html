<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSS Personalized Stock</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 OSS Personalized Stock</h1>
            <p>나만의 투자 성향에 맞는 종목을 추천해드립니다</p>
        </header>

        <div class="card-grid">
            <div class="card">
                <h2>🏢 관심 기업 입력</h2>
                <p>평소 관심 있던 기업을 입력하면<br>투자 성향을 분석해드립니다</p>
                <form action="/recommend" method="POST">
                    <input type="text" name="companies"
                           placeholder="예: 삼성전자" class="input-field">
                    <input type="text" name="companies"
                           placeholder="예: 카카오" class="input-field">
                    <input type="text" name="companies"
                           placeholder="예: 현대차" class="input-field">
                    <button type="submit" class="btn btn-primary">
                        종목 추천받기
                    </button>
                </form>
            </div>

            <div class="card">
                <h2>📰 뉴스 관심도 평가</h2>
                <p>최신 뉴스에 별점을 매겨<br>투자 성향을 파악합니다</p>
                <a href="/news" class="btn btn-secondary">
                    뉴스 평가 시작하기
                </a>
            </div>
        </div>
    </div>
</body>
</html>
