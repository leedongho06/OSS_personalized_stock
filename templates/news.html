<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 AI 뉴스 평가</title>
    <style>
        /* 기본 폰트 및 배경 설정 */
        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            margin: 0; 
            padding: 40px 20px; 
        }
        /* 중앙 정렬되는 메인 컨테이너 */
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }
        /* 제목 스타일 */
        h2 { 
            text-align: center; 
            color: #1e293b; 
            margin-bottom: 10px; 
            font-size: 28px; 
        }
        .subtitle { 
            text-align: center; 
            color: #64748b; 
            margin-bottom: 40px; 
            font-size: 15px; 
        }
        /* 뉴스 카드 디자인 */
        .news-card { 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            padding: 25px; 
            margin-bottom: 20px; 
            background-color: white; 
            transition: all 0.3s ease; 
        }
        .news-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 12px 24px rgba(0,0,0,0.1); 
            border-color: #cbd5e1; 
        }
        /* AI 섹터 배지 */
        .sector-badge { 
            display: inline-block; 
            background-color: #eff6ff; 
            color: #2563eb; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: 800; 
            margin-bottom: 15px; 
            border: 1px solid #bfdbfe; 
        }
        /* 뉴스 텍스트 */
        .news-title { font-size: 19px; font-weight: bold; margin: 0 0 12px 0; line-height: 1.4; color: #0f172a; }
        .news-desc { color: #475569; font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
        .news-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 20px; margin-bottom: 20px; }
        .news-link { color: #3b82f6; text-decoration: none; font-weight: 600; }
        .news-link:hover { text-decoration: underline; color: #2563eb; }
        .submit-btn { display: block; width: 100%; font-size: 18px; font-weight: bold; padding: 18px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; margin-top: 40px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.6); }

        /* ⭐ 별점 UI 전용 CSS */
        .rating-box { 
            background-color: #f8fafc; 
            padding: 15px 20px; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border: 1px solid #f1f5f9; 
        }
        .rating-label { font-weight: 600; color: #334155; font-size: 15px; }
        .star-rating { display: flex; flex-direction: row-reverse; justify-content: flex-end; }
        .star-rating input { display: none; }
        .star-rating label { font-size: 28px; color: #cbd5e1; cursor: pointer; transition: color 0.2s; padding: 0 2px; }
        .star-rating input:checked ~ label, 
        .star-rating label:hover, 
        .star-rating label:hover ~ label { color: #fbbf24; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔥 실시간 AI 뉴스 분석</h2>
        <p class="subtitle">제미나이 AI가 분류한 뉴스를 읽고 관심도를 평가해주세요!</p>
        <form action="/news/rate" method="POST">
            {% for n in news %}
            <div class="news-card">
                <div class="sector-badge">{{ n.sector }}</div>
                
                <!-- 💡 태그를 지우는 옵션 -->
                <h3 class="news-title">{{ n.title | striptags }}</h3>
                <p class="news-desc">{{ n.description | striptags }}</p>
                
                <div class="news-meta">
                    <a href="{{ n.link }}" class="news-link" target="_blank">🔗 기사 원문 보기</a>
                    <span style="color: #94a3b8;">{{ n.pubDate }}</span>
                </div>

                <div class="rating-box">
                    <span class="rating-label">이 뉴스에 대한 관심도는? 👉</span>
                    
                    <!-- ⭐ 별점 HTML 코드 -->
                    <div class="star-rating">
                        <input type="radio" id="star5_{{ loop.index0 }}" name="rating_{{ loop.index0 }}" value="5">
                        <label for="star5_{{ loop.index0 }}" title="5점">★</label>
                        <input type="radio" id="star4_{{ loop.index0 }}" name="rating_{{ loop.index0 }}" value="4">
                        <label for="star4_{{ loop.index0 }}" title="4점">★</label>
                        <input type="radio" id="star3_{{ loop.index0 }}" name="rating_{{ loop.index0 }}" value="3" checked>
                        <label for="star3_{{ loop.index0 }}" title="3점">★</label>
                        <input type="radio" id="star2_{{ loop.index0 }}" name="rating_{{ loop.index0 }}" value="2">
                        <label for="star2_{{ loop.index0 }}" title="2점">★</label>
                        <input type="radio" id="star1_{{ loop.index0 }}" name="rating_{{ loop.index0 }}" value="1">
                        <label for="star1_{{ loop.index0 }}" title="1점">★</label>
                    </div>
                </div>
            </div>
            {% endfor %}
            <button type="submit" class="submit-btn">평가 완료하고 맞춤형 주식 추천받기 ✨</button>
        </form>
    </div>
</body>
</html>
